<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0 ">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <title>Shop</title>
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        font-family: 'Montserrat', sans-serif;
        font-weight: 200;
        color:var(--tg-theme-text-color);
        background: var(--tg-theme-bg-color);
        }

        #main {
        width: 100%;
        padding: 20px;
        text-align: center;
        }

        h1 {
        margin-top: 50px;
        margin-bottom: 10px;
        }

        img {
        width: 70px;
        margin: 30px auto;
        }

        p {
        width: 350px;
        margin: 0 auto;
        }

        button {
        border: 0px;
        border-radius: 5px;
        margin-top: 50px;
        height: 60px:
        width: 200px;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        transition: all 500ms ease;
        color: var(--tg-theme-button-color);
        background: var(--tg-theme-button-text-color);
        }

    button:hover {
        background: var(--tg-theme-secondary-bg-color);
        }



    </style>
</head>
<body>
    <div id="main">
        <h1>Online shop</h1>
        <img src="https://i0.wp.com/images-ng.pixai.art/images/orig/f183110e-b0fd-458d-a337-ff045f0628e9?ssl=1">
        <p>по умолчанию браузер ставит жирность `bold` (обычно это числовое значение 700),
            что перебивает ваше правило `font-weight:
            200` на уровне `body`. Чтобы текст заголовка стал тонким,
            нужно сбросить его вес принудительно: `h1 { font-weight: 200; ... }`.</p>
        <button id="buy">Купить</button>
    </div>
    <script>
    Telegram.WebApp.ready();
    </script>
</body>
</html>
